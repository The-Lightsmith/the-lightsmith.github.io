name: Refresh Google Reviews Cache

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC
  workflow_dispatch:        # Allow manual trigger from GitHub Actions tab

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch reviews from Google Places API
        env:
          API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          PLACE_ID="ChIJw79roKw_kyURYlQvmTrI14o"

          curl -s \
            -H "X-Goog-Api-Key: $API_KEY" \
            -H "X-Goog-FieldMask: reviews.authorAttribution,reviews.rating,reviews.text,reviews.publishTime" \
            "https://places.googleapis.com/v1/places/${PLACE_ID}" \
            -o reviews_raw.json

          # Verify the response contains reviews before overwriting the cache
          if jq -e '.reviews | length > 0' reviews_raw.json > /dev/null 2>&1; then
            jq --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{reviews: .reviews, cached_at: $ts}' \
              reviews_raw.json > reviews.json
            echo "Cached $(jq '.reviews | length' reviews.json) reviews."
          else
            echo "Response did not contain reviews — keeping existing cache."
            cat reviews_raw.json
            exit 1
          fi

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.json
          if git diff --staged --quiet; then
            echo "Reviews unchanged — nothing to commit."
          else
            git commit -m "chore: refresh Google reviews cache"
            git push
          fi
